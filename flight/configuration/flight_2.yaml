# Per-build overrides for Argus satellite 2
# Merged over flight.yaml at build time: only keys that differ between builds belong here.

comms:
  SC_CALLSIGN:
    value: "CT62ARG"
  GS_CALLSIGN:
    value: "CS5CEP"

adcs:
  # Hard-iron bias in µT — replace with values from magnetometer calibration campaign
  MAG_BIAS_UT: [0.0, 0.0, 0.0]
  # Per-axis soft-iron scale factors — replace with values from calibration campaign
  MAG_SCALE: [1.0, 1.0, 1.0]
